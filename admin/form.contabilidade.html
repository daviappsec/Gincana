<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORMULARIO | CONTABILIDADE</title>
    <link rel="stylesheet" href="/style/style.css">
    <link rel="stylesheet" href="/style/form.css">
</head>

<body>
    <section class="main">

        <section class="item">
            <h1>SOMENTE LIDERES E COORDENAÇÃO</h1>
        </section>

        <form id="formulario1" class="formulario">
            
            <label for="nome1">NOME:</label>
            <input type="text" required id="nome1" autocomplete="name" placeholder="Digite seu nome">

            <label for="senha"> SENHA:</label>
            <input type="password" required id="senha" placeholder="Digite a senha de acesso">

            <button type="submit">ENTRAR</button>
            <button type="button">SAIR</button>
        </form>
    </section>

    <script src="/script/login.js"></script>
</body>

</html>

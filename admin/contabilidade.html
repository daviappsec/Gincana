<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONTABILIDADE</title>
    <link rel="stylesheet" href="/style/style.css">
    <link rel="stylesheet" href="/style/form.css">
</head>

<body>
    <section class="main">

        <section class="item" id="t-h1">
            <h1>CENTRAL DA PONTUAÇÃO</h1>
        </section>

        <form id="formulario2" class="formulario">

            <section class="item">
                <h1>ursos de guerra</h1>
            </section>

            <label for="pontos-ursos">PONTOS</label>
            <input type="number" id="pontos-ursos" required placeholder="Digite a pontuação da equipe">

            <button type="submit">SALVAR</button>

            <label for="perdidos-ursos">PONTOS PERDIDOS</label>
            <input type="number" id="perdidos-ursos" placeholder="Digite os pontos perdidos">

            <button type="button" id="descontar-ursos">
                DESCONTAR PONTOS
            </button>
        </form>


        <form id="formulario3" class="formulario">

            <section class="item">
                <h1>predarores</h1>
            </section>

            <label for="pontos-predadores">PONTOS</label>
            <input type="number" id="pontos-predadores" required placeholder="Digite a pontuação da equipe">

            <button type="submit">SALVAR</button>

            <label for="perdidos-predadores">PONTOS PERDIDOS</label>
            <input type="number" id="perdidos-predadores" placeholder="Digite os pontos perdidos">

            <button type="button" id="descontar-predadores">
                DESCONTAR PONTOS
            </button>
        </form>

        <form id="formulario4" class="formulario">

            <section class="item">
                <h1>IMPERIO ANUBIS</h1>
            </section>

            <label for="pontos-anubis">PONTOS</label>
            <input type="number" id="pontos-anubis" required placeholder="Digite a pontuação da equipe">

            <button type="submit">SALVAR</button>

            <label for="perdidos-anubis">PONTOS PERDIDOS</label>
            <input type="number" id="perdidos-anubis" placeholder="Digite os pontos perdidos">

            <button type="button" id="descontar-anubis">
                DESCONTAR PONTOS
            </button>
        </form>

        <form id="formulario5" class="formulario">

            <section class="item">
                <h1>ARUANA</h1>
            </section>

            <label for="pontos-aruana">PONTOS</label>
            <input type="number" id="pontos-aruana" required placeholder="Digite a pontuação da equipe">

            <button type="submit">SALVAR</button>

            <label for="perdidos-aruana">PONTOS PERDIDOS</label>
            <input type="number" id="perdidos-aruana" placeholder="Digite os pontos perdidos">

            <button type="button" id="descontar-aruana">
                DESCONTAR PONTOS
            </button>

        </form>

        <section class="formulario">
            <button type="button">SAIR</button>
        </section>
    </section>

    <script src="/script/placar.js"></script>

</body>

</html>
